<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentFlow - Tus notas</title>
    <!-- Enlazar CSS con la sintaxis de Flask-->
     <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <div class="header-container">
            <h1> StudenFlow </h1>
            <p> Tu espacio, tus notas. </p>
            </div>
    <!-- Barra de navegacion minimalista entre modulos -->
        <nav class="nav-tabs">
            <button id="tab-notas" class="tab-btn active"
            onclick="cambiarPestana('notas')">📝 Mis Notas</button>
            <button id="tab-calendario" class="tab-btn" onclick="cambiarPestana('calendario')">📆 Calendario</button>
        </nav>
    </header>


    <main class="main-container">
<!-- ================= VISTA 1: NOTAS ================= -->
        <div id="vista-notas" class="vista-modulo active">
            <div class="notes-layout">
                <!-- Columna Izquierda: Captura Inline -->
                <aside class="notes-sidebar">
                    <section class="notes-header">
                        <h2>✨ Nueva nota</h2>
                    </section>
                    <article id="nueva-nota-inline" class="note-card new-note-card" role="region" aria-label="Crear nueva nota">
                        <div class="new-note-input">
                            <input type="text" id="inline-titulo" placeholder="Título" aria-label="Título de la nota">
                            <textarea id="inline-contenido" placeholder="Toma una nota..." aria-label="Contenido de la nota" rows="2"></textarea>
                        </div>
                        <div class="new-note-actions">
                            <button type="button" id="btn-add-checklist" class="btn-icon-action" aria-label="Agregar checklist" title="Agregar checklist (/)">☑</button>
                            <button type="button" id="btn-guardar-nota" class="btn btn-primary">Guardar (Ctrl+Enter)</button>
                        </div>
                        <div id="inline-checklist-container" class="checklist-container hidden"></div>
                    </article>
                </aside>
                <!-- Columna Derecha: Lista de notas -->
                <section class="notes-main">
                    <div class="notes-header">
                        <h2>📝 Mis notas</h2>
                    </div>
                    <div id="contenedor-notas" class="notes-grid">
                        <!-- Aquí JavaScript inyecta las tarjetas de las notas -->
                    </div>
                </section>
            </div>
        </div>

 <!-- ================= VISTA 2: CALENDARIO ================= -->
        <div id="vista-calendario" class="vista-modulo">
            <section class="card calendar-card">
                <!-- Cabecera del calendario (Mes, Año, y Botones)-->

                <div class="calendar-header">
                    <button id="btn-prev-mes" class="btn-icon">◀</button>
                    <h2 id="mes-ano-texto">Septiembre 2026</h2>
                    <button id="btn-next-mes" class="btn-icon">▶</button>
                </div>

                <!-- Dias de la semana-->
                 <div class="weekdays-grid">
                    <div>Dom</div>
                    <div>Lun</div>
                    <div>Mar</div>
                    <div>Mié</div>
                    <div>Jue</div>
                    <div>Vie</div>
                    <div>Sab</div>
                 </div>
                <!-- Cuadrícula dinámica donde JS pinta los días -->
                <div id="dias-grid" class="days-grid">
                    <!-- Los dias se generan con JavaScript -->
                </div>
            </section>
        </div>
    </main>

<!-- ================= VENTANA MODAL PARA EVENTOS ================= -->
    <div id="modal-evento" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-fecha-titulo">Eventos</h3>
                <button class="btn-close" onclick="cerrarModal()">✕</button>
            </div>

            <!-- Lista de eventos creados en este día -->
            <div id="lista-eventos-dia" class="events-list"></div>

            <!-- Formulario para agregar un evento -->
            <form id="form-evento" class="form-modal">
                <input type="hidden" id="evento-fecha-input">
                <input type="text" id="evento-titulo-input" placeholder="Nombre de la entrega o examen..." required>
                <button type="submit" class="btn btn-primary">Guardar Evento</button>
            </form>
        </div>
    </div>

    <!-- ================= MODAL DE CONFIRMACIÓN PERSONALIZADO ================= -->
    <div id="modal-confirmar" class="modal-overlay">
        <div class="modal-content modal-confirm">
            <div class="modal-header">
                <h3 id="confirm-titulo">Confirmar</h3>
                <button class="btn-close" onclick="cerrarConfirmModal()">✕</button>
            </div>
            <p id="confirm-mensaje"></p>
            <div class="confirm-actions">
                <button class="btn btn-secondary" onclick="cerrarConfirmModal()">Cancelar</button>
                <button class="btn btn-danger" id="confirm-accion">Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Enlazamos el JavaScript usando url_for de Flask -->
    <script src="{{ url_for('static', filename='js/main.js') }}">
    </script>
</body>
</html>
